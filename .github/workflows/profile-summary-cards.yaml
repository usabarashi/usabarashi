name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-slime
    name: generate-github-profile-summary-cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - name: switch-to-summary-branch
        env:
          SUMMARY_BRANCH: github-profile-summay-cards
        run: |
          git fetch origin "${SUMMARY_BRANCH}" || true
          if git show-ref --verify --quiet "refs/heads/${SUMMARY_BRANCH}"; then
            git switch "${SUMMARY_BRANCH}"
          elif git show-ref --verify --quiet "refs/remotes/origin/${SUMMARY_BRANCH}"; then
            git switch --track "origin/${SUMMARY_BRANCH}"
          else
            git switch -c "${SUMMARY_BRANCH}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: vn7n24fzkq/github-profile-summary-cards@5055b27ac896c627043ead432f9b2fa973aa2c80 # v0.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "github-profile-summay-cards"
          UTC_OFFSET: 9
          EXCLUDE: ""
          AUTO_PUSH: true

  # Re-enable this workflow via the GitHub API before it can be disabled.
  # Scheduled workflows are auto-disabled after 60 days without commits on the
  # default branch; this job keeps the cron alive without pushing dummy commits.
  keepalive:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-slime
    name: keep-scheduled-workflow-alive
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1.2.1
